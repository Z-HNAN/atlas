schema: spec-driven

context: |
  项目：Atlas，AI 驱动的个人虚拟旅行收藏地图，面向 Microsoft Flight Simulator 2024 与 Sky4Sim 目视探索。
  技术栈：Vite、React、严格 TypeScript、React Router、Tailwind CSS、Zod、Leaflet、React Leaflet、Vitest、PWA。
  架构：Client-first 与 Local-first；IndexedDB 保存版本化 LocalAppEnvelope<TripPayload>；Cloudflare Access、Worker、D1 元数据和私有 R2 快照同步可选且默认关闭。
  外部能力：DeepSeek BYOK 生成结构化旅行计划；Nominatim 串行查询真实坐标；Leaflet 展示路线；浏览器本地生成严格 Custom/User PLN。
  部署：Vercel 只承载前端；同步 Worker 独立部署到 Cloudflare。
  安全：所有持久化和外部数据经 Zod 校验；API Key 和 Access JWT 不进入 Payload、导出或云端；成员权限由 Worker 强制校验；前端禁止私密凭证。
  协作：所有产出使用中文；Codex 实现前先维护 OpenSpec，交付前运行 typecheck、lint、test、format:check、build，并维护 START 指南。

rules:
  proposal:
    - 必须包含目标与非目标、至少两个方案的优缺点、影响范围和兼容迁移计划。
  design:
    - 必须说明 Envelope 与业务 Payload 的边界、失败恢复路径、风险权衡和验收标准。
  tasks:
    - 每项任务必须标明优先级、执行方和可验证的验收条件。
  specs:
    - 必须包含离线行为、持久化校验、安全边界和版本兼容要求。
